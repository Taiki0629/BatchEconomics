[project]
name = "batch-economics"
version = "0.1.0"
description = "さくらのAI Engine のリクエスト課金特性と最適バッチサイズの実測検証"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["30_development/tests"]
